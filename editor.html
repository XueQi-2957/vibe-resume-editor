<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历编辑器 - VibeResume</title>
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-w: 440px;
  --bg: #f0f2f5;
  --card-bg: #fff;
  --accent: #2563eb;
  --accent-light: #eef2ff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}

html, body { height: 100%; font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }

/* === Layout === */
.layout { display: flex; height: 100vh; }

/* === Toolbar === */
.toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: 52px;
  background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.toolbar h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.toolbar h1 small { font-weight: 400; font-size: 12px; color: var(--muted); }
.toolbar-actions { display: flex; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text);
  transition: all .15s;
}
.btn:hover { border-color: #ccc; box-shadow: var(--shadow); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #1d4ed8; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-danger { color: #dc2626; border-color: #fca5a5; }
.btn-danger:hover { background: #fef2f2; border-color: #dc2626; }

/* === Sidebar === */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  padding-top: 52px; overflow-y: auto; background: var(--bg);
  border-right: 1px solid var(--border);
}
.sidebar-inner { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

/* === Section Card === */
.section-card {
  background: var(--card-bg); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
  box-shadow: var(--shadow);
}
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; cursor: pointer; user-select: none;
  border-bottom: 1px solid transparent; transition: background .1s;
}
.section-header:hover { background: #f9fafb; }
.section-header.active { border-bottom-color: var(--border); }
.section-header .label { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.section-header .label .icon { width: 18px; height: 18px; }
.section-header .toggle { font-size: 10px; color: var(--muted); transition: transform .2s; }
.section-header.active .toggle { transform: rotate(180deg); }
.section-body { display: none; padding: 12px 14px; }
.section-body.open { display: block; }

/* === Form Fields === */
.field-group { margin-bottom: 10px; }
.field-group:last-child { margin-bottom: 0; }
.field-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input[type="text"], textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 5px; font-size: 13px; font-family: inherit;
  outline: none; transition: border-color .15s;
}
input[type="text"]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
textarea { resize: vertical; min-height: 52px; }
.rich-editor {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
  background: #fff;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 52px;
}
.rich-editor:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
.rich-editor[data-rows="1"] { min-height: 28px; }
.rich-editor:empty::before {
  content: attr(data-placeholder);
  color: #9ca3af;
  pointer-events: none;
}
.floating-toolbar {
  position: fixed;
  display: none;
  align-items: center;
  gap: 6px;
  padding: 6px;
  background: rgba(17, 24, 39, 0.96);
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  z-index: 1000;
}
.floating-toolbar.show { display: inline-flex; }
.floating-toolbar button {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  font-family: Georgia, "Times New Roman", serif;
  cursor: pointer;
}
.floating-toolbar button:hover { background: rgba(255,255,255,.14); }
.floating-toolbar button[data-style="italic"] { font-style: italic; }
.help-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.help-button {
  width: 28px;
  height: 28px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--muted);
  font-weight: 700;
  font-size: 14px;
  cursor: help;
}
.help-button:hover { border-color: #94a3b8; color: var(--text); box-shadow: var(--shadow); }
.help-popover {
  position: absolute;
  top: 36px;
  right: 0;
  width: 240px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(17, 24, 39, 0.96);
  color: #fff;
  font-size: 12px;
  line-height: 1.45;
  box-shadow: 0 12px 28px rgba(0,0,0,.18);
  opacity: 0;
  pointer-events: none;
  transform: translateY(-4px);
  transition: opacity .15s ease, transform .15s ease;
  z-index: 1200;
}
.help-wrap:hover .help-popover,
.help-wrap:focus-within .help-popover {
  display: block;
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

/* File selector */
.file-selector { display: flex; align-items: center; gap: 6px; }
.file-selector select {
  padding: 5px 28px 5px 10px; border: 1px solid var(--border); border-radius: 5px;
  font-size: 13px; background: #fff; cursor: pointer; max-width: 220px;
  appearance: auto; color: var(--text);
}
.file-selector .new-btn {
  background: none; border: 1px dashed var(--border); border-radius: 5px;
  cursor: pointer; font-size: 16px; line-height: 1; padding: 3px 8px; color: var(--accent);
}
.file-selector .new-btn:hover { background: var(--accent-light); border-color: var(--accent); }
.file-selector .rename-btn { font-size: 12px; padding: 4px 7px; }
.file-selector .delete-btn { color: var(--danger); font-size: 12px; padding: 4px 7px; }
.file-selector .delete-btn:hover { background: #fef2f2; border-color: var(--danger); }
.file-status { font-size: 11px; color: var(--muted); white-space: nowrap; }
.style-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-left: 8px;
  border-left: 1px solid var(--border);
}
.style-selector label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.style-selector select {
  padding: 5px 24px 5px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: #fff;
  color: var(--text);
  font-size: 12px;
}
.help-popover strong { display: block; margin-bottom: 4px; }
.help-popover p { margin: 4px 0 0; }

/* === List Items (education, projects, publications, skills) === */
.list-items { display: flex; flex-direction: column; gap: 8px; }
.list-item {
  background: #f9fafb; border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 12px; position: relative;
}
.list-item .item-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.list-item .item-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.project-logo {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  object-fit: cover;
  flex: 0 0 auto;
}
.image-picker {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  padding: 8px;
}
.image-picker-row {
  display: grid;
  grid-template-columns: 54px 1fr;
  gap: 10px;
  align-items: center;
}
.image-preview-box {
  width: 54px;
  height: 54px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #9ca3af;
  font-size: 11px;
}
.image-preview-box.avatar {
  height: 72px;
  width: 54px;
}
.image-preview-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.image-picker-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.image-picker-hint {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
  margin-top: 5px;
}
.file-input-hidden {
  display: none;
}
.crop-modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, .52);
  z-index: 1500;
  padding: 18px;
}
.crop-modal.show {
  display: flex;
}
.crop-dialog {
  width: min(92vw, 520px);
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 24px 70px rgba(15, 23, 42, .3);
  overflow: hidden;
}
.crop-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.crop-title {
  font-size: 14px;
  font-weight: 700;
}
.crop-body {
  padding: 14px;
}
.crop-stage {
  position: relative;
  height: 320px;
  background: #111827;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.crop-stage img {
  max-width: 100%;
  max-height: 100%;
  display: block;
  user-select: none;
  pointer-events: none;
}
.crop-box {
  position: absolute;
  border: 2px solid #fff;
  box-shadow: 0 0 0 999px rgba(0,0,0,.45);
  cursor: move;
}
.crop-controls {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}
.crop-row {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}
.crop-row input[type="range"] {
  flex: 1;
}
.crop-aspects {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.crop-aspects label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
}
.crop-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid var(--border);
}
.list-item .item-fields { display: flex; flex-direction: column; gap: 6px; }
.list-item .item-remove {
  cursor: pointer;
  color: #dc2626;
  font-size: 16px;
  line-height: 1;
  width: 16px;
  height: 16px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: .6;
  flex: 0 0 auto;
}
.list-item .item-remove:hover { opacity: 1; }
.move-controls {
  display: inline-flex;
  gap: 2px;
  align-items: center;
}
.move-btn {
  width: 18px;
  height: 18px;
  border: 0;
  background: transparent;
  color: #6b7280;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  font-size: 12px;
  opacity: .7;
}
.move-btn:hover { color: #111827; opacity: 1; }
.move-btn:disabled { opacity: .25; cursor: default; }

.add-btn {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 7px; border: 1px dashed var(--border); border-radius: 6px;
  font-size: 12px; color: var(--accent); cursor: pointer; background: transparent;
  transition: all .15s; margin-top: 6px;
}
.add-btn:hover { background: var(--accent-light); border-color: var(--accent); }

/* === Preview Panel === */
.preview-panel {
  flex: 1; padding-top: 52px; display: flex; flex-direction: column;
}
.preview-panel iframe {
  width: 100%; height: 100%; border: none; background: #eef2f7;
}
.preview-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 16px; background: #fff; border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
}
.preview-toolbar .actions { display: flex; gap: 6px; }

/* === Notification === */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1f2937; color: #fff; padding: 10px 24px; border-radius: 8px;
  font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.export-mode-modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(15, 23, 42, .48);
  z-index: 1600;
}
.export-mode-modal.show {
  display: flex;
}
.export-mode-dialog {
  width: min(92vw, 520px);
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 24px 70px rgba(15, 23, 42, .28);
  overflow: hidden;
}
.export-mode-head {
  padding: 16px 18px 10px;
  border-bottom: 1px solid var(--border);
}
.export-mode-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 4px;
}
.export-mode-subtitle {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.export-mode-body {
  display: grid;
  gap: 10px;
  padding: 14px 18px 16px;
}
.export-mode-choice {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  cursor: pointer;
  text-align: left;
}
.export-mode-choice:hover {
  border-color: var(--accent);
  background: #f8fbff;
  box-shadow: var(--shadow);
}
.export-mode-choice strong {
  display: block;
  font-size: 14px;
  margin-bottom: 3px;
}
.export-mode-choice span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.export-mode-actions {
  display: flex;
  justify-content: flex-end;
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  background: #f8fafc;
}

/* === Scrollbar === */
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

/* Responsive */
@media (max-width: 900px) {
  .sidebar { width: 100%; min-width: 0; border-right: none; }
  .preview-panel { display: none; }
}
</style>
</head>
<body>

<div class="layout">
  <!-- Toolbar -->
  <div class="toolbar">
    <h1>
      ✎ 简历编辑器
      <small>VibeResume</small>
    </h1>
    <div class="toolbar-actions">
          <div class="file-selector">
            <select id="file-select" onchange="switchFile(this.value)">
              <option value="">加载简历...</option>
            </select>
            <button class="new-btn" type="button" onclick="promptNewResume()" title="新建简历">＋</button>
            <button class="new-btn rename-btn" type="button" onclick="promptRenameResume()" title="重命名当前简历">重命名</button>
            <button class="new-btn delete-btn" type="button" onclick="deleteCurrentResume()" title="删除当前简历">删除</button>
            <span class="file-status" id="file-status"></span>
          </div>
          <div class="style-selector">
            <label for="template-select">模板</label>
            <select id="template-select" onchange="setTemplateStyle(this.value)">
              <option value="modern">现代</option>
              <option value="compact-hr">HR紧凑</option>
            </select>
            <label for="density-select">密度</label>
            <select id="density-select" onchange="setDensityStyle(this.value)">
              <option value="normal">标准</option>
              <option value="compact">紧凑</option>
              <option value="ultra">极紧凑</option>
            </select>
          </div>
          <div class="help-wrap">
        <button class="help-button" type="button" aria-label="使用说明">?</button>
        <div class="help-popover" role="tooltip">
          <strong>使用说明</strong>
          选中文本后可用悬浮条设置加粗、斜体。亮点右侧只点 X 删除。修改完输入框后，离开焦点或点右侧刷新再同步预览。
          <p>快捷键：`Ctrl+B` 加粗，`Ctrl+I` 斜体，`Ctrl+S` 保存。</p>
        </div>
      </div>
      <button class="btn btn-primary" id="save-resume-button" onclick="saveToServer()">💾 保存当前简历</button>
      <button class="btn btn-danger" onclick="resetDefaults()">↺ 重新读取当前简历</button>
      <button class="btn" onclick="exportToPDF(event)">📄 导出 PDF</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-inner" id="sidebar-root"></div>
  </div>

  <!-- Preview -->
  <div class="preview-panel">
    <div class="preview-toolbar">
      <span>📱 实时预览</span>
      <div class="actions">
        <button class="btn btn-sm" onclick="refreshPreview()">🔄 刷新</button>
      </div>
    </div>
    <iframe id="preview-frame" srcdoc=""></iframe>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="export-mode-modal" id="export-mode-modal" aria-hidden="true" onclick="if(event.target === this) resolveExportMode(null)">
  <div class="export-mode-dialog" role="dialog" aria-modal="true" aria-labelledby="export-mode-title">
    <div class="export-mode-head">
      <div class="export-mode-title" id="export-mode-title">选择 PDF 导出方式</div>
      <div class="export-mode-subtitle">请选择明确的导出模式。长页版会生成单页长 PDF；A4 版会生成适合打印的多页 PDF。</div>
    </div>
    <div class="export-mode-body">
      <button class="export-mode-choice" type="button" data-export-mode="a4" onclick="resolveExportMode('a4')">
        <strong>A4 多页打印版</strong>
        <span>适合纸质打印，会自动分页并在续页加入页眉。</span>
      </button>
      <button class="export-mode-choice" type="button" data-export-mode="long" onclick="resolveExportMode('long')">
        <strong>一页长简历版</strong>
        <span>适合线上投递和网页预览，只生成一页长 PDF。</span>
      </button>
    </div>
    <div class="export-mode-actions">
      <button class="btn" type="button" onclick="resolveExportMode(null)">取消</button>
    </div>
  </div>
</div>
<div class="floating-toolbar" id="floating-toolbar" aria-hidden="true">
  <button type="button" data-style="bold" aria-label="加粗" title="加粗" onmousedown="handleToolbarMouseDown(event)" onclick="applyFormatFromToolbar('bold')">B</button>
  <button type="button" data-style="italic" aria-label="斜体" title="斜体" onmousedown="handleToolbarMouseDown(event)" onclick="applyFormatFromToolbar('italic')">I</button>
</div>
<div class="crop-modal" id="image-crop-modal" aria-hidden="true">
  <div class="crop-dialog" role="dialog" aria-modal="true" aria-labelledby="crop-title">
    <div class="crop-head">
      <div class="crop-title" id="crop-title">裁切图片</div>
      <button class="item-remove" type="button" onclick="cancelImageCrop()" aria-label="关闭裁切">✕</button>
    </div>
    <div class="crop-body">
      <div class="crop-stage" id="crop-stage">
        <img id="crop-image" alt="待裁切图片">
        <div class="crop-box" id="crop-box"></div>
      </div>
      <div class="crop-controls">
        <div class="crop-row">
          <span>缩放</span>
          <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1" oninput="handleCropZoomInput(this.value)">
        </div>
        <div class="crop-row crop-aspects" id="crop-aspects">
          <label><input type="radio" name="crop-aspect" value="3:4" onchange="setCropAspectFromControl(this.value)">头像 3:4</label>
          <label><input type="radio" name="crop-aspect" value="1:1" onchange="setCropAspectFromControl(this.value)">Logo 1:1</label>
          <label><input type="radio" name="crop-aspect" value="free" onchange="setCropAspectFromControl(this.value)">自由</label>
        </div>
        <p class="image-picker-hint">拖动裁切框调整位置，使用缩放控制图片大小。确认后会压缩为内联图片，随简历保存。</p>
      </div>
    </div>
    <div class="crop-actions">
      <button class="btn" type="button" onclick="cancelImageCrop()">取消</button>
      <button class="btn btn-primary" id="confirm-crop-button" type="button" onclick="confirmImageCrop()">确认裁切</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Data Model
// ============================================================
const EMPTY_RESUME_DATA = {
  meta: {
    template: 'modern',
    density: 'normal'

function createDefaultData() {
  return JSON.parse(JSON.stringify(EMPTY_RESUME_DATA));
}

function replaceCurrentData(nextData) {
  const next = createDefaultData();
  const incoming = JSON.parse(JSON.stringify(nextData || {}));
  next.meta = {
    ...next.meta,
    ...(incoming.meta || {})
  };
  next.header = { ...next.header, ...(incoming.header || {}) };
  next.education = Array.isArray(incoming.education) ? incoming.education : [];
  next.infoLines = Array.isArray(incoming.infoLines) ? incoming.infoLines : [];
  next.publications = Array.isArray(incoming.publications) ? incoming.publications : [];
  next.internships = Array.isArray(incoming.internships) ? incoming.internships : [];
  next.campus = Array.isArray(incoming.campus) ? incoming.campus : [];
  next.projects = Array.isArray(incoming.projects) ? incoming.projects : [];
  next.customSections = Array.isArray(incoming.customSections) ? incoming.customSections : [];
  next.skills = Array.isArray(incoming.skills) ? incoming.skills : [];
  next.sectionOrder = Array.isArray(incoming.sectionOrder) ? incoming.sectionOrder : [...DEFAULT_SECTION_ORDER];
  data = next;
}

let undoStack = [];
let undoIndex = -1;
let activeEditPath = null;
let activeEditSnapshot = null;
let savedSelection = null;

function deepClone(value) {
  return JSON.parse(JSON.stringify(value));
}

function captureUndoSnapshot() {
  return deepClone(data);
}

function commitUndoSnapshot(snapshot) {
  if (!snapshot) return;
  const current = JSON.stringify(snapshot);
  if (undoIndex >= 0 && JSON.stringify(undoStack[undoIndex]) === current) return;
  undoStack = undoStack.slice(0, undoIndex + 1);
  undoStack.push(snapshot);
  undoIndex = undoStack.length - 1;
}

function captureAndCommitUndo() {
  commitUndoSnapshot(captureUndoSnapshot());
}

function initUndoHistory() {
  undoStack = [captureUndoSnapshot()];
  undoIndex = 0;
}

function restoreUndoSnapshot(snapshot) {
  if (!snapshot) return;
  replaceCurrentData(snapshot);
  normalizeData();
  renderSidebar();
  renderPreviewNow();
}

function undoLastAction() {
  if (undoIndex <= 0) return;
  undoIndex -= 1;
  restoreUndoSnapshot(undoStack[undoIndex]);
}

async function loadFromSavedIndex() {
  try {
    const res = await fetch('./index.html', { cache: 'no-store' });
    if (!res.ok) return false;
    const html = await res.text();
    const parsed = extractResumeDataFromHTML(html);
    if (!parsed) return false;
    replaceCurrentData(parsed);
    normalizeData();
    return true;
  } catch (e) {
    return false;
  }
}

async function loadTemplateFallback() {
  const candidates = ['./index.template.html', './index.html'];
  for (const candidate of candidates) {
    try {
      const res = await fetch(candidate, { cache: 'no-store' });
      if (!res.ok) continue;
      const html = await res.text();
      const parsed = extractResumeDataFromHTML(html);
      if (!parsed?.header) continue;
      replaceCurrentData(parsed);
      normalizeData();
      renderSidebar();
      renderPreviewNow();
      updateFileStatus();
      return true;
    } catch (e) {
      // Try next fallback file.
    }
  }
  return false;
}

function extractResumeDataFromHTML(html) {
  const result = {
    meta: { ...createDefaultData().meta },
    header: null,
    education: [],
    infoLines: [],
    publications: [],
    internships: [],
    campus: [],
    projects: [],
    customSections: [],
    skills: [],
    sectionOrder: []
  };

  const doc = parseHTMLDocument(html);
  if (doc) {
    const mainEl = doc.querySelector('main.page') || doc.body;
    const template = mainEl?.getAttribute('data-template') || '';
    const density = mainEl?.getAttribute('data-density') || '';
    result.meta = {
      template: TEMPLATE_OPTIONS.includes(template) ? template : 'modern',
      density: DENSITY_OPTIONS.includes(density) ? density : 'normal'
    };

    const headerEl = doc.querySelector('.resume-header');
    if (headerEl) {
      const defaultHeader = createDefaultData().header;
      const contactLinks = [...headerEl.querySelectorAll('.contact-line a')];
      const phoneLink = contactLinks.find((a) => (a.getAttribute('href') || '').startsWith('tel:'));
      const emailLink = contactLinks.find((a) => (a.getAttribute('href') || '').startsWith('mailto:'));
      const githubLink = contactLinks.find((a) => (a.getAttribute('href') || '').includes('github.com'));
      result.header = {
        ...defaultHeader,
        eyebrow: stripHtml(headerEl.querySelector('.eyebrow')?.innerHTML || ''),
        name: stripHtml(headerEl.querySelector('h1')?.innerHTML || ''),
        title: stripHtml(headerEl.querySelector('.identity-line')?.innerHTML || ''),
        techLine: stripHtml(headerEl.querySelector('.tech-line')?.innerHTML || ''),
        phone: phoneLink ? stripHtml(phoneLink.innerHTML).replace(/^.*?(\+?\d[\d\s-]*)$/, '$1').trim() : defaultHeader.phone,
        email: emailLink ? stripHtml(emailLink.innerHTML).trim() : defaultHeader.email,
        github: githubLink ? stripHtml(githubLink.innerHTML).trim().replace(/^https?:\/\//, '') : defaultHeader.github,
        photo: headerEl.querySelector('.profile-photo')?.getAttribute('src') || defaultHeader.photo
      };
    }

    const addSectionOrder = (key) => {
      if (!key || result.sectionOrder.includes(key)) return;
      result.sectionOrder.push(key);
    };

    const parseEducationSection = (sectionEl) => {
      sectionEl.querySelectorAll('.education-grid').forEach((grid) => {
        const cells = [...grid.querySelectorAll(':scope > div')].map((cell) => stripHtml(cell.innerHTML));
        for (let i = 0; i + 2 < cells.length; i += 3) {
          result.education.push({
            school: cells[i],
            major: cells[i + 1],
            period: cells[i + 2]
          });
        }
      });
      sectionEl.querySelectorAll('p.info-line').forEach((info) => {
        const strong = info.querySelector('strong');
        if (!strong) return;
        const label = stripHtml(strong.innerHTML).replace(/：$/, '');
        const clone = info.cloneNode(true);
        clone.querySelector('strong')?.remove();
        result.infoLines.push({
          label,
          value: normalizeRichContent(clone.innerHTML.replace(/^\s*：/, '').trim())
        });
      });
    };

    const parsePublicationsSection = (sectionEl) => {
      sectionEl.querySelectorAll('.publications p').forEach((pub) => {
        const text = stripHtml(pub.innerHTML);
        const match = text.match(/^([\s\S]*?)\s+\(([^()]*)\)$/);
        result.publications.push({
          title: match ? match[1] : pub.innerHTML,
          year: match ? match[2] : ''
        });
      });
    };

    const parseInternshipsSection = (sectionEl) => {
      sectionEl.querySelectorAll('article.experience').forEach((article) => {
        const companyTitle = article.querySelector('.company-title, .project-title');
        const head = article.querySelector('.entry-head');
        if (!companyTitle || !head) return;
        const headStrong = [...head.querySelectorAll(':scope > strong')];
        const summary = article.querySelector('.summary');
        result.internships.push({
          company: stripHtml(companyTitle.innerHTML),
          role: stripHtml(headStrong[1]?.innerHTML || ''),
          period: stripHtml(head.querySelector(':scope > span')?.innerHTML || ''),
          title: stripHtml(article.querySelector('h3')?.innerHTML || ''),
          summary: summary ? summary.innerHTML : '',
          highlights: [...article.querySelectorAll('li')].map((li) => li.innerHTML)
        });
      });
    };

    const parseCampusSection = (sectionEl) => {
      sectionEl.querySelectorAll('article.experience').forEach((article) => {
        const title = article.querySelector('.project-title');
        const head = article.querySelector('.entry-head');
        if (!title || !head) return;
        const headStrong = [...head.querySelectorAll(':scope > strong')];
        result.campus.push({
          name: stripHtml(title.innerHTML),
          org: stripHtml(headStrong[1]?.innerHTML || ''),
          period: stripHtml(head.querySelector(':scope > span')?.innerHTML || ''),
          highlights: [...article.querySelectorAll('li')].map((li) => li.innerHTML)
        });
      });
    };

    const parseProjectsSection = (sectionEl) => {
      sectionEl.querySelectorAll('article.experience').forEach((article) => {
        const projectTitle = article.querySelector('.project-title');
        const head = article.querySelector('.entry-head');
        if (!projectTitle || !head) return;
        const headStrong = [...head.querySelectorAll(':scope > strong')];
        const summary = article.querySelector('.summary');
        const link = article.querySelector('.project-link');
        const badge = article.querySelector('.project-stat');
        let summaryHtml = '';
        if (summary) {
          const summaryClone = summary.cloneNode(true);
          summaryClone.querySelector('.project-stat')?.remove();
          summaryHtml = summaryClone.innerHTML;
        }
        result.projects.push({
          name: stripHtml(projectTitle.innerHTML),
          role: stripHtml(headStrong[1]?.innerHTML || ''),
          period: stripHtml(head.querySelector(':scope > span')?.innerHTML || ''),
          link: link ? stripHtml(link.getAttribute('href') || '').replace(/^https?:\/\//, '') : '',
          logo: projectTitle.querySelector('.project-logo')?.getAttribute('src') || '',
          badge: badge ? stripHtml(badge.innerHTML) : '',
          summary: summaryHtml,
          highlights: [...article.querySelectorAll('li')].map((li) => li.innerHTML)
        });
      });
    };

    const parseSkillsSection = (sectionEl) => {
      sectionEl.querySelectorAll('.skills-list li').forEach((skill) => {
        result.skills.push(skill.innerHTML);
      });
    };

    const parseCustomSection = (sectionEl) => {
      const title = stripHtml(sectionEl.querySelector('h2')?.innerHTML || '');
      let items = [...sectionEl.querySelectorAll('.custom-item')].map((item) => item.innerHTML).filter(Boolean);
      if (items.length === 0) {
        items = [...sectionEl.querySelectorAll('.publications p, p')]
          .filter((item) => !item.classList.contains('info-line'))
          .map((item) => item.innerHTML)
          .filter(Boolean);
      }
      if (!title && items.length === 0) return;
      result.customSections.push({
        title: title || '自定义模块',
        items
      });
    };

    const sections = [...mainEl.querySelectorAll(':scope > section.section')];
    sections.forEach((sectionEl) => {
      const title = stripHtml(sectionEl.querySelector(':scope > h2')?.innerHTML || '').replace(/\s+/g, '');
      const classes = sectionEl.classList;
      if (classes.contains('projects-section') || title.includes('项目经历')) {
        parseProjectsSection(sectionEl);
        addSectionOrder('projects');
      } else if (classes.contains('internships-section') || title.includes('实习经历')) {
        parseInternshipsSection(sectionEl);
        addSectionOrder('internships');
      } else if (classes.contains('skills-section') || title.includes('专业技能')) {
        parseSkillsSection(sectionEl);
        addSectionOrder('skills');
      } else if (title.includes('教育背景')) {
        parseEducationSection(sectionEl);
        addSectionOrder('education');
      } else if (title.includes('论文发表')) {
        parsePublicationsSection(sectionEl);
        addSectionOrder('publications');
      } else if (title.includes('校园经历')) {
        parseCampusSection(sectionEl);
        addSectionOrder('campus');
      } else {
        parseCustomSection(sectionEl);
        addSectionOrder('customSections');
      }
    });

    if (result.sectionOrder.length === 0) {
      result.sectionOrder = [...DEFAULT_SECTION_ORDER];
    }

    return result.header ? result : null;
  }

  const headerMatch = html.match(/<p class="eyebrow">([\s\S]*?)<\/p>[\s\S]*?<h1>([\s\S]*?)<\/h1>[\s\S]*?<p class="identity-line">([\s\S]*?)<\/p>/);
  if (headerMatch) {
    result.header = {
      ...createDefaultData().header,
      eyebrow: stripHtml(headerMatch[1]),
      name: stripHtml(headerMatch[2]),
      title: stripHtml(headerMatch[3])
    };
  }

  const eduGrid = html.match(/<div class="education-grid">([\s\S]*?)<\/div><p class="info-line"/);
  if (eduGrid) {
    const eduRegex = /<div>([\s\S]*?)<\/div>/g;
    const cells = [];
    let cell;
    while ((cell = eduRegex.exec(eduGrid[1]))) {
      cells.push(stripHtml(cell[1]));
    }
    // Each education entry is 3 cells: school, major, period
    for (let i = 0; i + 2 < cells.length; i += 3) {
      result.education.push({
        school: cells[i],
        major: cells[i + 1],
        period: cells[i + 2]
      });
    }
  }

  const infoRegex = /<p class="info-line"><strong>([\s\S]*?)：<\/strong>([\s\S]*?)<\/p>/g;
  let match;
  while ((match = infoRegex.exec(html))) {
    result.infoLines.push({
      label: stripHtml(match[1]),
      value: normalizeRichContent(match[2])
    });
  }

  const publicationMatch = html.match(/<div class="publications">([\s\S]*?)<\/div><\/section>/);
  if (publicationMatch) {
    const publicationRegex = /<p>([\s\S]*?)\s+\(([\s\S]*?)\)<\/p>/g;
    let pub;
    while ((pub = publicationRegex.exec(publicationMatch[1]))) {
      result.publications.push({
        title: stripHtml(pub[1]),
        year: stripHtml(pub[2])
      });
    }
  }

  const internshipSectionMatch = html.match(/<section class="section internships-section">([\s\S]*?)<\/section>/);
  if (internshipSectionMatch) {
    const internshipRegex = /<article class="experience">([\s\S]*?)<\/article>/g;
    let internshipMatch;
    while ((internshipMatch = internshipRegex.exec(internshipSectionMatch[1]))) {
      const block = internshipMatch[1];
      const headMatch = block.match(/<div class="entry-head">([\s\S]*?)<\/div>/);
      const titleMatch = headMatch ? headMatch[1].match(/<strong class="(?:company-title|project-title)">([\s\S]*?)<\/strong>[\s\S]*?<strong>([\s\S]*?)<\/strong>[\s\S]*?<span>([\s\S]*?)<\/span>/) : null;
      const h3Match = block.match(/<h3>([\s\S]*?)<\/h3>/);
      const summaryMatch = block.match(/<p class="summary">([\s\S]*?)<\/p>/);
      const highlightMatches = [...block.matchAll(/<li>([\s\S]*?)<\/li>/g)];
      if (titleMatch) {
        result.internships.push({
          company: stripHtml(titleMatch[1]),
          role: stripHtml(titleMatch[2]),
          period: stripHtml(titleMatch[3]),
          title: h3Match ? stripHtml(h3Match[1]) : '',
          summary: summaryMatch ? summaryMatch[1] : '',
          highlights: highlightMatches.map((m) => m[1])
        });
      }
    }
  }

  const projectSectionMatch = html.match(/<section class="section projects-section">([\s\S]*?)<\/section>/);
  const projectHtml = projectSectionMatch ? projectSectionMatch[1] : html;
  const projectRegex = /<article class="experience">([\s\S]*?)<\/article>/g;
  let projectMatch;
  while ((projectMatch = projectRegex.exec(projectHtml))) {
    const block = projectMatch[1];
    const headMatch = block.match(/<div class="entry-head">([\s\S]*?)<\/div>/);
    const titleMatch = headMatch ? headMatch[1].match(/<strong class="project-title">([\s\S]*?)<\/strong>[\s\S]*?<strong>([\s\S]*?)<\/strong>[\s\S]*?<span>([\s\S]*?)<\/span>/) : null;
    const summaryMatch = block.match(/<p class="summary">([\s\S]*?)<\/p>/);
    const highlightMatches = [...block.matchAll(/<li>([\s\S]*?)<\/li>/g)];
    const linkMatch = block.match(/<h3><a class="project-link" href="https:\/\/([\s\S]*?)">/);
    const badgeMatch = block.match(/<span class="project-stat">([\s\S]*?)<\/span>/);
    if (titleMatch) {
      result.projects.push({
        name: stripHtml(titleMatch[1]),
        role: stripHtml(titleMatch[2]),
        period: stripHtml(titleMatch[3]),
        link: linkMatch ? stripHtml(linkMatch[1]) : '',
        logo: (() => {
          const logoMatch = titleMatch[1].match(/<img[^>]+class="[^"]*\bproject-logo\b[^"]*"[^>]+src="([^"]+)"/);
          return logoMatch ? stripHtml(logoMatch[1]) : '';
        })(),
        badge: badgeMatch ? stripHtml(badgeMatch[1]) : '',
        summary: summaryMatch ? summaryMatch[1] : '',
        highlights: highlightMatches.map((m) => m[1])
      });
    }
  }

  const skillsMatch = html.match(/<ul class="skills-list">([\s\S]*?)<\/ul>/);
  if (skillsMatch) {
    const skillRegex = /<li>([\s\S]*?)<\/li>/g;
    let skill;
    while ((skill = skillRegex.exec(skillsMatch[1]))) {
      result.skills.push(skill[1]);
    }
  }

  return result.header ? result : null;
}

function parseHTMLDocument(html) {
  try {
    return new DOMParser().parseFromString(String(html || ''), 'text/html');
  } catch (e) {
    return null;
  }
}

function stripHtml(html) {
  const template = document.createElement('template');
  template.innerHTML = String(html || '');
  return (template.content.textContent || '').replace(/\s+/g, ' ').trim();
}

function resetDefaults() {
  if (!currentFile) {
    showToast('❌ 当前没有可重载的简历文件');
    return;
  }
  if (!confirm(`确定重新读取 "${currentFile}" 吗？未保存修改将丢失。`)) return;
  clearDraftStorage();
  doLoadFile(currentFile);
}

function clearDraftStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch(e) { /* ignore storage errors */ }
}

  header: true,
  education: false,
  infoLines: false,
  publications: false,
  internships: false,
  campus: false,
  projects: false,
  customSections: false,
  skills: false
};

function renderSidebar() {
  const root = document.getElementById('sidebar-root');
  const sectionRenderers = {
    education: renderEducationSection,
    publications: renderPublicationsSection,
    internships: renderInternshipsSection,
    campus: renderCampusSection,
    projects: renderProjectsSection,
    customSections: renderCustomSections,
    skills: renderSkillsSection
  };
  const rendered = new Set();
  const orderedSections = getNormalizedSectionOrder()
    .filter((key) => sectionRenderers[key])
    .map((key) => {
      rendered.add(key);
      return sectionRenderers[key]();
    })
    .join('');
  const missingSections = DEFAULT_SECTION_ORDER
    .filter((key) => !rendered.has(key) && sectionRenderers[key])
    .map((key) => sectionRenderers[key]())
    .join('');
  root.innerHTML = `
    ${renderHeaderSection()}
    ${orderedSections}
    ${missingSections}
  `;
  bindRichEditors();
}

function renderPreviewNow() {
  const html = generateHTML();
  document.getElementById('preview-frame').srcdoc = html;
}

function sectionHead(id, label, icon) {
  const open = expanded[id] ? 'active' : '';
  return `<div class="section-header ${open}" onclick="toggleSection('${id}')">
    <span class="label"><span class="icon">${icon}</span>${label}</span>
    <span class="toggle">▼</span>
  </div>`;
}

function sectionBody(id, content) {
  const open = expanded[id] ? 'open' : '';
  return `<div class="section-body ${open}" id="body-${id}">${content}</div>`;
}

function getProjectLogoSrc(projectOrName) {
  if (projectOrName && typeof projectOrName === 'object' && projectOrName.logo) {
    return projectOrName.logo;
  }
  return '';
}

function normalizeAssetPathForHTML(src) {
  const value = String(src || '').trim();
  if (!value) return value;
  if (/^(?:data:|blob:|https?:|file:)/i.test(value)) return value;
  return value.replace(/^(?:\.\.\/|\.\/)?(assets|private-assets)\//, '/$1/');
}

function projectLogoHTML(projectOrName) {
  const name = typeof projectOrName === 'object' ? projectOrName.name : projectOrName;
  const src = normalizeAssetPathForHTML(getProjectLogoSrc(projectOrName));
  if (!src) return '';
  return `<img class="project-logo" src="${escAttr(src)}" alt="${escAttr(name)} logo">`;
}

function toEditorHTML(value) {
  return sanitizeRichHTML(String(value || '')) || '';
}

function renderRichTextField(value, path, options = {}) {
  const rows = options.rows || 2;
  const placeholder = options.placeholder || '';
  const extraStyle = options.style ? ` style="${escAttr(options.style)}"` : '';
  return `<div
    class="rich-editor"
    contenteditable="true"
    role="textbox"
    aria-multiline="true"
    spellcheck="false"
    data-path="${escAttr(path)}"
    data-rows="${rows}"
    data-placeholder="${escAttr(placeholder)}"
    onfocus="handleRichTextFocus(this)"
    oninput="handleRichTextInput(this)"
    onblur="handleRichTextBlur(this)"
    onkeydown="handleRichTextKeydown(event, this)"
    onpaste="handleRichTextPaste(event, this)"${extraStyle}
  >${toEditorHTML(value)}</div>`;
}

function renderImagePicker({ label, path, src, kind, previewClass = '', hint = '' }) {

function sanitizeRichHTML(html) {
  const template = document.createElement('template');
  template.innerHTML = String(html || '');

  const allowed = new Set(['B', 'STRONG', 'I', 'EM', 'BR']);
  const isBoldElement = (el) => {
    if (!el || el.nodeType !== Node.ELEMENT_NODE) return false;
    const tag = el.tagName.toUpperCase();
    if (tag === 'B' || tag === 'STRONG') return true;
    const style = (el.getAttribute('style') || '').toLowerCase().replace(/\s+/g, '');
    if (!style) return false;
    return /font-weight:(bold|[5-9]00)/.test(style);
  };
  const isItalicElement = (el) => {
    if (!el || el.nodeType !== Node.ELEMENT_NODE) return false;
    const tag = el.tagName.toUpperCase();
    if (tag === 'I' || tag === 'EM') return true;
    const style = (el.getAttribute('style') || '').toLowerCase().replace(/\s+/g, '');
    return style.includes('font-style:italic');
  };

  const walk = (node) => {
    Array.from(node.childNodes).forEach((child) => {
      if (child.nodeType === Node.TEXT_NODE) return;
      if (child.nodeType !== Node.ELEMENT_NODE) {
        child.remove();
        return;
      }

      const tag = child.tagName.toUpperCase();
      if (!allowed.has(tag)) {
        if (isBoldElement(child)) {
          const strong = document.createElement('strong');
          strong.innerHTML = child.innerHTML;
          child.replaceWith(strong);
          walk(strong);
          return;
        }
        if (isItalicElement(child)) {
          const em = document.createElement('em');
          em.innerHTML = child.innerHTML;
          child.replaceWith(em);
          walk(em);
          return;
        }
        const text = document.createTextNode(child.textContent || '');
        child.replaceWith(text);
        return;
      }

      if (isBoldElement(child)) {
        const strong = document.createElement('strong');
        strong.innerHTML = child.innerHTML;
        child.replaceWith(strong);
        walk(strong);
        return;
      }
      if (isItalicElement(child)) {
        const em = document.createElement('em');
        em.innerHTML = child.innerHTML;
        child.replaceWith(em);
        walk(em);
        return;
      }

      Array.from(child.attributes).forEach((attr) => child.removeAttribute(attr.name));
      walk(child);
    });
  };

  walk(template.content);
  return template.innerHTML.replace(/<div>/gi, '<br>').replace(/<\/div>/gi, '');
}

function normalizeRichContent(html) {
  const sanitized = sanitizeRichHTML(html);
  const template = document.createElement('template');
  template.innerHTML = sanitized;
  const text = template.content.textContent || '';
  const plain = text.trim();
  return plain ? sanitized : '';
}

function getPathValue(path) {
  return String(path || '').split('.').reduce((obj, part) => {
    if (obj == null) return undefined;
    const key = /^\d+$/.test(part) ? Number(part) : part;
    return obj[key];
  }, data);
}

function setPathValue(path, value) {
  const parts = String(path || '').split('.');
  let obj = data;
  for (let i = 0; i < parts.length - 1; i += 1) {
    const key = /^\d+$/.test(parts[i]) ? Number(parts[i]) : parts[i];
    if (obj[key] == null) obj[key] = {};
    obj = obj[key];
  }
  const last = parts[parts.length - 1];
  obj[/^\d+$/.test(last) ? Number(last) : last] = value;
}

function clearImageField(path) {
  setPathValue(path, '');
  captureAndCommitUndo();
  renderSidebar();
  renderPreviewNow();
}

const IMAGE_LIMITS = {
  avatar: { title: '裁切头像', aspect: '3:4', width: 360, height: 480 },
  'project-logo': { title: '裁切项目 logo', aspect: '1:1', width: 256, height: 256 }
};

let cropState = null;

function parseAspect(value) {
  if (!value || value === 'free') return null;
  const [w, h] = value.split(':').map(Number);
  if (!w || !h) return null;
  return w / h;
}

function handleImageFileInput(event, path, kind) {
  const input = event.target;
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    showToast('❌ 请选择图片文件');
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    showToast('❌ 图片过大，请选择 8MB 以内的图片');
    return;
  }

  const reader = new FileReader();
  reader.onload = () => openImageCropper(String(reader.result || ''), path, kind, file.type);
  reader.onerror = () => showToast('❌ 图片读取失败');
  reader.readAsDataURL(file);
}

function openImageCropper(src, path, kind, mimeType = 'image/png') {
  const settings = IMAGE_LIMITS[kind] || IMAGE_LIMITS['project-logo'];
  const modal = document.getElementById('image-crop-modal');
  const image = document.getElementById('crop-image');
  const zoom = document.getElementById('crop-zoom');
  const title = document.querySelector('#image-crop-modal .crop-title');

  cropState = {
    src,
    path,
    kind,
    mimeType,
    aspect: settings.aspect,
    zoom: 1,
    imageNaturalWidth: 0,
    imageNaturalHeight: 0,
    imageRect: null,
    crop: null,
    dragging: false,
    dragOffsetX: 0,
    dragOffsetY: 0
  };

  title.textContent = settings.title;
  zoom.value = '1';
  [...document.querySelectorAll('input[name="crop-aspect"]')].forEach((input) => {
    input.checked = input.value === settings.aspect;
  });
  image.onload = () => {
    cropState.imageNaturalWidth = image.naturalWidth;
    cropState.imageNaturalHeight = image.naturalHeight;
    resetCropBox();
  };
  image.src = src;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
}

function resetCropBox() {
  if (!cropState) return;
  const stage = document.getElementById('crop-stage');
  const image = document.getElementById('crop-image');
  const stageRect = stage.getBoundingClientRect();
  const naturalRatio = cropState.imageNaturalWidth / cropState.imageNaturalHeight;
  let width = stageRect.width;
  let height = width / naturalRatio;
  if (height > stageRect.height) {
    height = stageRect.height;
    width = height * naturalRatio;
  }
  width *= cropState.zoom;
  height *= cropState.zoom;
  const left = (stageRect.width - width) / 2;
  const top = (stageRect.height - height) / 2;
  cropState.imageRect = { left, top, width, height };
  image.style.width = `${width}px`;
  image.style.height = `${height}px`;

  const aspect = parseAspect(cropState.aspect);
  let cropW = Math.min(width, stageRect.width) * 0.72;
  let cropH = aspect ? cropW / aspect : Math.min(height, stageRect.height) * 0.72;
  if (cropH > Math.min(height, stageRect.height) * 0.82 && aspect) {
    cropH = Math.min(height, stageRect.height) * 0.82;
    cropW = cropH * aspect;
  }
  cropW = Math.min(cropW, width);
  cropH = Math.min(cropH, height);
  if (aspect && cropW / cropH > aspect) {
    cropW = cropH * aspect;
  } else if (aspect && cropW / cropH < aspect) {
    cropH = cropW / aspect;
  }
  cropState.crop = {
    left: Math.max(left, left + (width - cropW) / 2),
    top: Math.max(top, top + (height - cropH) / 2),
    width: cropW,
    height: cropH
  };
  clampCropToImage();
  renderCropBox();
}

function renderCropBox() {
  if (!cropState?.crop) return;
  const box = document.getElementById('crop-box');
  const crop = cropState.crop;
  box.style.left = `${crop.left}px`;
  box.style.top = `${crop.top}px`;
  box.style.width = `${crop.width}px`;
  box.style.height = `${crop.height}px`;
}

function handleCropZoomInput(value) {
  if (!cropState) return;
  cropState.zoom = Number(value) || 1;
  resetCropBox();
}

function setCropAspectFromControl(value) {
  if (!cropState) return;
  cropState.aspect = value;
  resetCropBox();
}

function getVisibleImageBounds() {
  if (!cropState?.imageRect) return null;
  const stage = document.getElementById('crop-stage');
  const stageRect = stage.getBoundingClientRect();
  const imageRect = cropState.imageRect;
  const left = Math.max(0, imageRect.left);
  const top = Math.max(0, imageRect.top);
  const right = Math.min(stageRect.width, imageRect.left + imageRect.width);
  const bottom = Math.min(stageRect.height, imageRect.top + imageRect.height);
  return {
    left,
    top,
    width: Math.max(0, right - left),
    height: Math.max(0, bottom - top)
  };
}

function clampCropToImage() {
  if (!cropState?.crop) return;
  const rect = getVisibleImageBounds();
  if (!rect) return;
  const crop = cropState.crop;
  if (rect.width <= 0 || rect.height <= 0) return;
  crop.left = Math.min(Math.max(rect.left, crop.left), rect.left + rect.width - crop.width);
  crop.top = Math.min(Math.max(rect.top, crop.top), rect.top + rect.height - crop.height);
}

function bindCropInteractions() {
  const box = document.getElementById('crop-box');
  box.addEventListener('pointerdown', (event) => {
    if (!cropState?.crop) return;
    cropState.dragging = true;
    cropState.dragOffsetX = event.clientX - cropState.crop.left;
    cropState.dragOffsetY = event.clientY - cropState.crop.top;
    box.setPointerCapture(event.pointerId);
  });
  box.addEventListener('pointermove', (event) => {
    if (!cropState?.dragging || !cropState.crop) return;
    cropState.crop.left = event.clientX - cropState.dragOffsetX;
    cropState.crop.top = event.clientY - cropState.dragOffsetY;
    clampCropToImage();
    renderCropBox();
  });
  const endDrag = (event) => {
    if (!cropState) return;
    cropState.dragging = false;
    try { box.releasePointerCapture(event.pointerId); } catch (e) { /* ignore stale pointer */ }
  };
  box.addEventListener('pointerup', endDrag);
  box.addEventListener('pointercancel', endDrag);
}

function cancelImageCrop() {
  const modal = document.getElementById('image-crop-modal');
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  document.getElementById('crop-image').removeAttribute('src');
  cropState = null;
}

async function confirmImageCrop() {
  if (!cropState?.crop || !cropState.imageRect) return;
  const settings = IMAGE_LIMITS[cropState.kind] || IMAGE_LIMITS['project-logo'];
  const image = document.getElementById('crop-image');
  const crop = cropState.crop;
  const imageRect = cropState.imageRect;
  const scaleX = cropState.imageNaturalWidth / imageRect.width;
  const scaleY = cropState.imageNaturalHeight / imageRect.height;
  const sourceX = Math.max(0, (crop.left - imageRect.left) * scaleX);
  const sourceY = Math.max(0, (crop.top - imageRect.top) * scaleY);
  const sourceW = Math.min(crop.width * scaleX, cropState.imageNaturalWidth - sourceX);
  const sourceH = Math.min(crop.height * scaleY, cropState.imageNaturalHeight - sourceY);
  const canvas = document.createElement('canvas');
  canvas.width = settings.width;
  canvas.height = settings.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, sourceX, sourceY, sourceW, sourceH, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
  setPathValue(cropState.path, dataUrl);
  cancelImageCrop();
  captureAndCommitUndo();
  renderSidebar();
  renderPreviewNow();
  showToast('✅ 图片已裁切并插入');
}

function setRichFieldValue(el, html) {
  el.innerHTML = toEditorHTML(html);
}

function getRichFieldPath(path) {
  const parts = path.split('.');
  let target = data;
  for (let i = 0; i < parts.length - 1; i++) target = target[parts[i]];
  return { target, key: parts[parts.length - 1] };
}

function updateRichField(path, html) {
  const { target, key } = getRichFieldPath(path);
  target[key] = normalizeRichContent(html);
}

function handleRichTextInput(el) {
  updateRichField(el.dataset.path, el.innerHTML);
  activeEditPath = el.dataset.path;
}

function handleRichTextFocus(el) {
  activeEditPath = el.dataset.path;
  activeEditSnapshot = captureUndoSnapshot();
}

function handleRichTextBlur(el) {
  updateRichField(el.dataset.path, el.innerHTML);
  captureAndCommitUndo();
  activeEditPath = null;
  activeEditSnapshot = null;
  renderPreviewNow();
}

function getRichEditorFromNode(node) {
  if (!node) return null;
  if (node.nodeType === Node.ELEMENT_NODE) return node.closest('.rich-editor');
  if (node.parentElement) return node.parentElement.closest('.rich-editor');
  return null;
}

function getSelectedRichEditor() {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0) return null;
  const anchorEditor = getRichEditorFromNode(selection.anchorNode);
  const focusEditor = getRichEditorFromNode(selection.focusNode);
  if (!anchorEditor || anchorEditor !== focusEditor) return null;
  return anchorEditor;
}

function selectNodeContents(node) {
  const selection = window.getSelection();
  if (!selection || !node) return;
  const rangeFactory = typeof Range !== 'undefined'
    ? () => new Range()
    : () => document.createRange();
  const range = rangeFactory();
  range.selectNodeContents(node);
  selection.removeAllRanges();
  selection.addRange(range);
}

function selectionHasFormat(range, tagName) {
  if (!range) return false;
  const nodes = [range.commonAncestorContainer, ...Array.from(range.cloneContents().querySelectorAll(tagName))];
  const targetTag = tagName.toUpperCase();
  return nodes.some((node) => {
    if (!node) return false;
    if (node.nodeType === Node.ELEMENT_NODE && node.tagName.toUpperCase() === targetTag) return true;
    let current = node.parentElement;
    while (current) {
      if (current.tagName && current.tagName.toUpperCase() === targetTag) return true;
      current = current.parentElement;
    }
    return false;
  });
}

function saveCurrentSelection() {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
    savedSelection = null;
    return false;
  }
  savedSelection = selection.getRangeAt(0).cloneRange();
  return true;
}

function restoreSavedSelection() {
  if (!savedSelection) return false;
  const selection = window.getSelection();
  if (!selection) return false;
  selection.removeAllRanges();
  selection.addRange(savedSelection);
  return true;
}

function wrapSelectionWithTag(editor, tagName) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return false;

  const range = selection.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) return false;

  const targetTag = tagName.toUpperCase();
  const shouldRemove = selectionHasFormat(range, targetTag);
  if (shouldRemove) {
    const fragment = range.extractContents();
    const wrapper = document.createElement('div');
    wrapper.appendChild(fragment);
    wrapper.querySelectorAll(targetTag).forEach((node) => {
      const parent = node.parentNode;
      while (node.firstChild) parent.insertBefore(node.firstChild, node);
      parent.removeChild(node);
    });
    const nodes = Array.from(wrapper.childNodes);
    nodes.forEach((node) => range.insertNode(node));
    selectNodeContents(editor);
    saveCurrentSelection();
    return true;
  }

  const fragment = range.extractContents();
  const wrapper = document.createElement(tagName);
  wrapper.appendChild(fragment);
  range.insertNode(wrapper);
  selectNodeContents(wrapper);
  saveCurrentSelection();
  return true;
}

function applyInlineFormat(editor, format) {
  if (!editor) return false;
  const tagName = format === 'italic' ? 'em' : 'strong';
  const applied = wrapSelectionWithTag(editor, tagName);
  if (!applied) return false;
  updateRichField(editor.dataset.path, editor.innerHTML);
  return true;
}

function handleRichTextKeydown(event, el) {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'b') {
    event.preventDefault();
    applyInlineFormat(el, 'bold');
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'i') {
    event.preventDefault();
    applyInlineFormat(el, 'italic');
  }
}

function handleRichTextPaste(event, el) {
  event.preventDefault();
  const text = (event.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
  updateRichField(el.dataset.path, el.innerHTML);
}

function bindRichEditors() {
  document.querySelectorAll('.rich-editor').forEach((el) => {
    const { target, key } = getRichFieldPath(el.dataset.path);
    setRichFieldValue(el, target[key]);
  });
}

function handleGlobalRichTextShortcuts(event) {
  if (!(event.ctrlKey || event.metaKey)) return;
  const key = event.key.toLowerCase();
  if (key === 'z') {
    event.preventDefault();
    undoLastAction();
    return;
  }
  if (key === 's') {
    event.preventDefault();
    saveToServer();
    return;
  }
  if (key !== 'b' && key !== 'i') return;
  const editor = getSelectedRichEditor() || getRichEditorFromNode(document.activeElement);
  if (!editor) return;
  event.preventDefault();
  applyInlineFormat(editor, key === 'i' ? 'italic' : 'bold');
}

function getFloatingToolbar() {
  return document.getElementById('floating-toolbar');
}

function hideFloatingToolbar() {
  const toolbar = getFloatingToolbar();
  toolbar.classList.remove('show');
  toolbar.setAttribute('aria-hidden', 'true');
}

function positionFloatingToolbar(rect) {
  const toolbar = getFloatingToolbar();
  const toolbarRect = toolbar.getBoundingClientRect();
  const top = Math.max(60, rect.top - toolbarRect.height - 10);
  const left = Math.min(
    window.innerWidth - toolbarRect.width - 12,
    Math.max(12, rect.left + (rect.width - toolbarRect.width) / 2)
  );
  toolbar.style.top = `${top}px`;
  toolbar.style.left = `${left}px`;
}

function updateFloatingToolbar() {
  const selection = window.getSelection();
  const editor = getSelectedRichEditor();
  if (!selection || !editor || selection.isCollapsed || selection.rangeCount === 0) {
    hideFloatingToolbar();
    return;
  }

  saveCurrentSelection();
  const toolbar = getFloatingToolbar();
  toolbar.classList.add('show');
  toolbar.setAttribute('aria-hidden', 'false');
  const rect = selection.getRangeAt(0).getBoundingClientRect();
  positionFloatingToolbar(rect);
}

function handleToolbarMouseDown(event) {
  event.preventDefault();
}

function applyFormatFromToolbar(format) {
  if (!restoreSavedSelection()) return;
  const editor = getSelectedRichEditor();
  if (!editor) return;
  applyInlineFormat(editor, format);
  updateFloatingToolbar();
}

function handleDocumentSelectionChange() {
  window.setTimeout(updateFloatingToolbar, 0);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return esc(s).replace(/'/g,'&#39;'); }
function rich(value) { return normalizeRichContent(value); }

function normalizeData() {
  data.meta = {
    template: TEMPLATE_OPTIONS.includes(data.meta?.template) ? data.meta.template : 'modern',
    density: DENSITY_OPTIONS.includes(data.meta?.density) ? data.meta.density : 'normal'
  };
  data.header = { ...createDefaultData().header, ...(data.header || {}) };
  data.education = (data.education || []).map((item) => ({
    school: String(item.school || ''),
    major: String(item.major || ''),
    period: String(item.period || '')
  }));
  data.infoLines = (data.infoLines || []).map((info) => ({
    ...info,
    value: normalizeRichContent(info.value)
  }));
  data.publications = (data.publications || []).map((item) => ({
    ...item,
    title: normalizeRichContent(item.title)
  }));
  data.internships = (data.internships || []).map((item) => ({
    ...item,
    summary: normalizeRichContent(item.summary),
    highlights: (item.highlights || []).map((highlight) => normalizeRichContent(highlight))
  }));
  data.campus = (data.campus || []).map((item) => ({
    ...item,
    highlights: (item.highlights || []).map((highlight) => normalizeRichContent(highlight))
  }));
  data.projects = (data.projects || []).map((proj) => ({
    ...proj,
    summary: normalizeRichContent(proj.summary),
    highlights: (proj.highlights || []).map((highlight) => normalizeRichContent(highlight))
  }));
  data.customSections = (data.customSections || []).map((section) => ({
    title: String(section.title || '').trim() || '自定义模块',
    items: (section.items || []).map((item) => normalizeRichContent(item)).filter((item) => item)
  }));
  data.skills = (data.skills || []).map((skill) => normalizeRichContent(skill));
  data.sectionOrder = getNormalizedSectionOrder();
  syncStyleControls();
}

function syncStyleControls() {
  const templateSelect = document.getElementById('template-select');
  const densitySelect = document.getElementById('density-select');
  if (templateSelect) templateSelect.value = data.meta?.template || 'modern';
  if (densitySelect) densitySelect.value = data.meta?.density || 'normal';
}

function setTemplateStyle(template) {
  data.meta = data.meta || {};
  data.meta.template = TEMPLATE_OPTIONS.includes(template) ? template : 'modern';
  syncStyleControls();
  captureAndCommitUndo();
  renderPreviewNow();
  markDirty();
}

function setDensityStyle(density) {
  data.meta = data.meta || {};
  data.meta.density = DENSITY_OPTIONS.includes(density) ? density : 'normal';
  syncStyleControls();
  captureAndCommitUndo();
  renderPreviewNow();
  markDirty();
}

function getPageClassName() {
  const template = TEMPLATE_OPTIONS.includes(data.meta?.template) ? data.meta.template : 'modern';
  const density = DENSITY_OPTIONS.includes(data.meta?.density) ? data.meta.density : 'normal';
  return `page template-${template} density-${density}`;
}

function getNormalizedSectionOrder() {
  const allowed = new Set(DEFAULT_SECTION_ORDER);
  const source = Array.isArray(data.sectionOrder) && data.sectionOrder.length
    ? data.sectionOrder
    : DEFAULT_SECTION_ORDER;
  const order = [];
  source.forEach((key) => {
    if (allowed.has(key) && !order.includes(key)) order.push(key);
  });
  DEFAULT_SECTION_ORDER.forEach((key) => {
    if (!order.includes(key)) order.push(key);
  });
  return order;
}

function renderEducationHTML() {
  if (data.education.length === 0 && data.infoLines.length === 0) return '';
  let html = `<section class="section">
    <h2><svg class="section-icon"><use href="#icon-school"></use></svg>教育背景</h2>`;
  if (data.education.length > 0) {
    html += `<div class="education-grid">`;
    data.education.forEach(e => {
      html += `<div>${esc(e.school)}</div><div>${esc(e.major)}</div><div>${esc(e.period)}</div>`;
    });
    html += `</div>`;
  }
  data.infoLines.forEach(info => {
    html += `<p class="info-line"><strong>${esc(info.label)}：</strong>${rich(info.value)}</p>`;
  });
  html += `</section>`;
  return html;
}

      <h2><svg class="section-icon"><use href="#icon-file-text"></use></svg>论文发表</h2>

  data.publications.forEach(p => {

function getExportEndpoint() {
  return '/export-pdf';
}

let pendingExportModeResolve = null;

function chooseExportMode() {
  const modal = document.getElementById('export-mode-modal');
  if (!modal) return Promise.resolve('a4');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  return new Promise((resolve) => {
    pendingExportModeResolve = resolve;
  });
}

function resolveExportMode(mode) {
  const modal = document.getElementById('export-mode-modal');
  if (modal) {
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
  }
  const resolve = pendingExportModeResolve;
  pendingExportModeResolve = null;
  if (resolve) {
    resolve(mode === 'long' ? 'long' : mode === 'a4' ? 'a4' : null);
  }
}

// ============================================================
// Export PDF (server-side via Node.js + Chromium)
// ============================================================
async function exportToPDF(event) {
  const btn = event?.currentTarget || document.querySelector('[onclick^="exportToPDF"]');
  const orig = btn.textContent;
  const mode = await chooseExportMode();
  if (!mode) return;

  btn.textContent = mode === 'long' ? '⏳ 生成长页PDF中...' : '⏳ 生成A4 PDF中...';
  btn.disabled = true;

  try {
    const html = generateFullHTML();
    const res = await fetch(getExportEndpoint(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ html, mode })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      showToast('❌ 导出失败：' + (err.error || '未知错误'));
      btn.textContent = orig;
      btn.disabled = false;
      return;
    }

    // Get the PDF as a blob
    const blob = await res.blob();
    
    // Ask user for filename
    const suffix = mode === 'long' ? '长页版' : 'A4打印版';
    const defaultName = `${data.header.name || 'resume'}-${(data.header.title || 'resume').split('·')[0].trim() || 'resume'}-${suffix}.pdf`;
    const filename = prompt('保存为（可修改文件名避免覆盖）：', defaultName) || defaultName;

    // Trigger download
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast(`✅ PDF 已下载：${filename}（浏览器下载文件夹可查看）`);
  } catch (e) {
    showToast('❌ 导出失败：' + e.message);
  }

  btn.textContent = orig;
  btn.disabled = false;
}

async function populateFileList(selectFile) {
  const sel = document.getElementById('file-select');
  if (!sel) return;
  const files = await fetchFileList();
  sel.innerHTML = '<option value="">切换简历...</option>';
  files.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = f.replace(/\.html$/, '');
    sel.appendChild(opt);
  });
  if (selectFile && files.includes(selectFile)) {
    sel.value = selectFile;
  } else if (files.length > 0 && !selectFile) {
    // Load default (last edited)
    const last = localStorage.getItem(PREF_KEY);
    if (last && files.includes(last)) { sel.value = last; }
    else { sel.value = files[0]; }
  }
  if (sel.value) {
    await doLoadFile(sel.value);
    return;
  }
  await loadTemplateFallback();
}

async function doLoadFile(filename) {
  if (!filename) return;
  // Warn if dirty
  if (isDirty && currentFile && currentFile !== filename) {
    if (!confirm(`"${currentFile}" 有未保存的修改，确定切换吗？未保存内容将丢失。`)) {
      // Restore select
      const sel = document.getElementById('file-select');
      if (sel) sel.value = currentFile;
      return;
    }
  }
  // Unlock old file
  if (currentFile) await unlockFile(currentFile);
  // Load new file
  const result = await loadResumeFile(filename);
  if (!result || !result.ok) {
    showToast('❌ 加载失败');
    return;
  }
  // Parse HTML into data model
  const parsed = extractResumeDataFromHTML(result.html);
  if (parsed && parsed.header) {
    replaceCurrentData(parsed);
  } else {
    showToast('⚠️ 无法解析简历结构，请检查文件格式');
    return;
  }
  currentFile = filename;
  normalizeData();
  lastSavedHTML = generateFullHTML();
  isDirty = false;
  localStorage.setItem(PREF_KEY, filename);
  await lockFile(filename);
  initUndoHistory();
  renderSidebar();
  syncStyleControls();
  renderPreviewNow();
  updateFileStatus();
  showToast(`✅ 已加载：${filename}`);
}

async function switchFile(filename) {
  if (!filename) return;
  await doLoadFile(filename);
}

async function promptNewResume() {
  const name = prompt('输入新简历文件名（不需加 .html）：', '新简历');
  if (!name) return;
  const result = await createNewResume(name);
  if (result && result.ok) {
    await populateFileList(result.file);
    showToast(`✅ 已创建：${result.file}`);
  } else {
    showToast('❌ 创建失败');
  }
}

async function renameCurrentResume(newName) {
  const oldFile = currentFile;
  const cleanName = String(newName || '').trim();
  if (!oldFile) {
    const result = {ok: false, error: '请先选择一份简历'};
    showToast('❌ ' + result.error);
    return result;
  }
  if (!cleanName) {
    const result = {ok: false, error: '新文件名不能为空'};
    showToast('❌ ' + result.error);
    return result;
  }
  if (isDirty) {
    const result = {ok: false, error: '请先保存当前简历后再重命名'};
    showToast('❌ ' + result.error);
    return result;
  }

  const result = await renameResumeFile(oldFile, cleanName);
  if (result && result.ok) {
    if (localStorage.getItem(PREF_KEY) === oldFile) {
      localStorage.setItem(PREF_KEY, result.file);
    }
    currentFile = '';
    await populateFileList(result.file);
    clearDraftStorage();
    showToast(`✅ 已重命名：${result.file}`);
  } else {
    showToast('❌ 重命名失败：' + (result?.error || '未知错误'));
  }
  return result;
}

async function promptRenameResume() {
  if (!currentFile) {
    showToast('❌ 请先选择一份简历');
    return;
  }
  const currentName = currentFile.replace(/\.html$/i, '');
  const nextName = prompt('输入新的简历文件名（不需加 .html）：', currentName);
  if (!nextName) return;
  await renameCurrentResume(nextName);
}

async function deleteCurrentResume() {
  const fileToDelete = currentFile;
  if (!fileToDelete) {
    const result = {ok: false, error: '请先选择一份简历'};
    showToast('❌ ' + result.error);
    return result;
  }

  const dirtyHint = isDirty ? '当前有未保存修改，' : '';
  if (!confirm(`确定删除 "${fileToDelete}" 吗？${dirtyHint}此操作不可恢复。`)) {
    return {ok: false, cancelled: true};
  }

  const result = await deleteResumeFile(fileToDelete);
  if (result && result.ok) {
    if (localStorage.getItem(PREF_KEY) === fileToDelete) {
      localStorage.removeItem(PREF_KEY);
    }
    currentFile = '';
    lastSavedHTML = '';
    isDirty = false;
    clearDraftStorage();
    const files = await fetchFileList();
    await populateFileList(files[0] || '');
    updateFileStatus();
    showToast(`✅ 已删除：${fileToDelete}`);
  } else {
    showToast('❌ 删除失败：' + (result?.error || '未知错误'));
  }
  return result;
}

function updateFileStatus() {
  const el = document.getElementById('file-status');
  if (!el) return;
  const dirty = isDirty ? ' ● 未保存' : '';
  el.textContent = currentFile ? `${currentFile}${dirty}` : '模板预览（未保存）';
}

// Override saveToServer to use resume file
async function saveToServer() {
  if (!currentFile) {
    showToast('❌ 请先选择或创建一份简历');
    return;
  }
  const btn = document.getElementById('save-resume-button');
  const orig = btn.textContent;
  btn.textContent = '⏳ 保存中...';
  btn.disabled = true;

  try {
    const html = generateFullHTML();
    const result = await saveResumeFile(currentFile, html);
    if (result.ok) {
      lastSavedHTML = html;
      isDirty = false;
      updateFileStatus();
      clearDraftStorage();
      showToast(`✅ 已保存：${currentFile}`);
    } else {
      showToast('❌ 保存失败：' + (result.error || '未知错误'));
    }
  } catch (e) {
    showToast('❌ 保存失败：' + e.message);
  }

  btn.textContent = orig;
  btn.disabled = false;
}

// ── Unsaved changes detection ──
function markDirty() {
  if (!isDirty) {
    isDirty = true;
    updateFileStatus();
  }
}

// Patch renderPreviewNow to mark dirty on changes
const _origRenderPreview = renderPreviewNow;
renderPreviewNow = function() {
  const html = generateHTML();
  document.getElementById('preview-frame').srcdoc = html;
  // Check if content changed from last saved
  const fullHtml = generateFullHTML();
  if (lastSavedHTML && fullHtml !== lastSavedHTML) {
    markDirty();
  }
};

// ============================================================
// Toast
// ============================================================
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ============================================================
// Init
// ============================================================
async function initEditor() {
  clientId = genClientId();

  // Load file list and default file
  await populateFileList();

  document.addEventListener('keydown', handleGlobalRichTextShortcuts);
  document.addEventListener('selectionchange', handleDocumentSelectionChange);
  bindCropInteractions();
  document.addEventListener('click', (event) => {
    if (!event.target.closest('.floating-toolbar') && !event.target.closest('.rich-editor')) {
      hideFloatingToolbar();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && document.getElementById('image-crop-modal')?.classList.contains('show')) {
      cancelImageCrop();
    }
    if (event.key === 'Escape' && document.getElementById('export-mode-modal')?.classList.contains('show')) {
      resolveExportMode(null);
    }
  });
  window.addEventListener('scroll', hideFloatingToolbar, true);
  window.addEventListener('resize', hideFloatingToolbar);

  // Warn on unsaved close
  window.addEventListener('beforeunload', (event) => {
    if (isDirty) {
      event.preventDefault();
      event.returnValue = '';
    }
  });
}

initEditor();
</script>
